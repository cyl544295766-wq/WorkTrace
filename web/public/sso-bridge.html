<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WorkTrace · 自动登录</title>
</head>
<body style="font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; color: #6b7280; background: #f7f9fc">
  <p id="tip">正在登录 WorkTrace…</p>
  <script>
    // WorkTrace SSO 桥接页：会话方案（SESSION Cookie 由浏览器原生接收），
    // 同时按前端约定写入 localStorage worktrace:user。
    const DEFAULT_TARGET = '/'
    const params = new URLSearchParams(location.search)
    const parentOrigin = params.get('parent')
    const defaultTarget = params.get('target') || DEFAULT_TARGET

    function post(msg) { parent.postMessage(msg, parentOrigin || '*') }

    window.addEventListener('message', async (e) => {
      if (parentOrigin && e.origin !== parentOrigin) return
      const d = e.data || {}
      if (d.type !== 'sso-login') return
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: d.username, password: d.password }),
        })
        const body = await res.json().catch(() => null)
        if (!body || body.code !== 200) throw new Error((body && body.message) || ('登录失败 HTTP ' + res.status))
        localStorage.setItem('worktrace:user', JSON.stringify({
          token: '',
          user: { ...body.data, roles: [] },
        }))
        location.replace(d.target || defaultTarget)
      } catch (err) {
        post({ type: 'sso-error', message: String((err && err.message) || err) })
      }
    })

    window.addEventListener('load', () => {
      if (!parentOrigin) { location.replace(defaultTarget); return }
      post({ type: 'sso-ready' })
    })
  </script>
</body>
</html>
