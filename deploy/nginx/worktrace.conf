# WorkTrace 站点 —— 与 NewTrevl 的 travel-os（:80）完全独立，互不干扰。
# 安装：scp 到 /etc/nginx/sites-available/worktrace.conf
#       sudo ln -sf /etc/nginx/sites-available/worktrace.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# 注意：腾讯云安全组需放行 TCP:8081 入站（应用后端仍只监听 127.0.0.1:8080，
#       公网只能经由这里的 nginx 反代到达 /api/）。
server {
    listen 8081;
    server_name _;

    root /var/www/worktrace;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # API 反代到 Spring Boot（仅本机 8080，不对外）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # actuator 健康检查只留给服务器本机用，不在公网暴露（如需经 nginx 检查，
    # 在服务器本机 curl 127.0.0.1:8080 即可）

    # SPA 回退：深链刷新（/tasks、/reports）交给 index.html，路由模式为 history
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
