spring:
  application:
    name: worktrace
  profiles:
    default: dev
  datasource:
    # 三处时区对齐之一（JDBC 会话）。参数不可省，见 design.md §9.2。
    url: "jdbc:mysql://127.0.0.1:3306/work_system?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai"
    username: ${DB_USERNAME:wt_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: WorkTraceHikari
  session:
    store-type: jdbc
    jdbc:
      platform: mysql
      # ⚠️ 表结构唯一来源：server/db/01a_spring_session.sql（Docker 首次初始化自动执行；
      #    手动/存量环境按 server/db/README.md 的顺序执行）。应用启动不执行任何建表 DDL
      #    （initialize-schema=never：生产启动期 DDL 被禁止；脚本演进 = db/ 新增编号分片，
      #    存量环境按 server/db/README.md 的升级约定手工执行）。
      initialize-schema: never
  mvc:
    # 未知路由交给 GlobalExceptionHandler 统一返回 404 响应体
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  sql:
    init:
      mode: never

server:
  # 单机部署：应用只监听本机，由 Nginx 反代
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  # ⚠️ 不要在此配置 session/cookie：Spring Session 接管后 server.servlet.session.* 是死配置
  #   （原生容器会话被绕过，SESSION Cookie 属性与会话超时都不读这里）。
  #   唯一生效点：com.worktrace.common.config.SessionCookieConfig（Cookie 属性 + 7 天有效期）。

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  file:
    path: logs

# ── AI 报告生成：OpenAI / DeepSeek 兼容的 Chat Completions ────────────
ai:
  # OpenAI: https://api.openai.com/v1 ｜ DeepSeek: https://api.deepseek.com/v1
  base-url: https://api.deepseek.com/v1
  # 生产通过环境变量 AI_API_KEY 注入（留空则生成时返回"未配置 ai.api-key"）
  api-key: ${AI_API_KEY:}
  # DeepSeek: deepseek-chat ｜ OpenAI: gpt-4o-mini
  model: deepseek-chat
