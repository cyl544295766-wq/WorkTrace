spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# ⚠️ 原 server.servlet.session.cookie.* 在 Spring Session 接管后不生效（原生容器会话被绕过），
#   已删除。会话 Cookie 属性（secure=false/httpOnly=true/SameSite=Lax/Path=/）与会话有效期 7 天
#   统一在 com.worktrace.common.config.SessionCookieConfig 显式定义；升 HTTPS 时按 design.md §1.4
#   一次性改为 secure=true 并打开 HSTS。

logging:
  level:
    root: INFO
    com.worktrace: INFO
