spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        # ★ 内网 HTTP 阶段必须为 false。浏览器在 HTTP 下会丢弃 Secure Cookie，
        #   表现为"登录成功后立刻掉线"且无任何报错。升公网时按 design.md §1.4
        #   一次性完成：域名+证书 / secure=true / 打开 HSTS。
        secure: false

logging:
  level:
    root: INFO
    com.worktrace: INFO
