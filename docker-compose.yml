# WorkTrace 单机部署编排：MySQL 持久化 + Spring Boot 后端 + Nginx 前端
# 使用：docker compose up -d --build
# 说明：本文件取代了原先"仅开发库"的 compose；被替换的旧文件可用
#       `git show HEAD~1:docker-compose.yml > docker-compose.dev.yml`
#       一类方式找回。

name: worktrace

services:
  # ── 1. 数据库 ────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: worktrace-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # root 密码：生产部署前在根目录 .env 中设置 MYSQL_ROOT_PASSWORD 覆盖默认值
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-WorkTrace_Root_2026!}
      # 默认数据库名（与 server/db/*.sql 中各分片 `USE work_system` 一致）
      MYSQL_DATABASE: work_system
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --lower-case-table-names=0
      - --max-connections=200
      - --log-error-verbosity=2
    ports:
      # 仅发布到本机回环：宿主机只依赖 80 端口入口，MySQL 不对外
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建库建表（按文件名字典序执行）：
      # 01 建库 → 01a Spring Session 表 → 02..08 建表赋权 → 09 账号主机改 %
      #          → 10 sys_user 表与演示数据
      - ./docker/mysql-init/00_load_tz.sh:/docker-entrypoint-initdb.d/00_load_tz.sh:ro
      - ./server/db/01_user_session.sql:/docker-entrypoint-initdb.d/01_user_session.sql:ro
      - ./server/db/01a_spring_session.sql:/docker-entrypoint-initdb.d/01a_spring_session.sql:ro
      - ./server/db/02_task.sql:/docker-entrypoint-initdb.d/02_task.sql:ro
      - ./server/db/03_note_time.sql:/docker-entrypoint-initdb.d/03_note_time.sql:ro
      - ./server/db/04_stat.sql:/docker-entrypoint-initdb.d/04_stat.sql:ro
      - ./server/db/05_report.sql:/docker-entrypoint-initdb.d/05_report.sql:ro
      - ./server/db/06_notify_audit.sql:/docker-entrypoint-initdb.d/06_notify_audit.sql:ro
      - ./server/db/07_export.sql:/docker-entrypoint-initdb.d/07_export.sql:ro
      - ./server/db/08_sys_seed.sql:/docker-entrypoint-initdb.d/08_sys_seed.sql:ro
      - ./docker/mysql-init/09_docker_app_user.sql:/docker-entrypoint-initdb.d/09_docker_app_user.sql:ro
      - ./server/db/10_sys_user.sql:/docker-entrypoint-initdb.d/10_sys_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── 2. 后端（多阶段构建，见 server/Dockerfile）──────────────
  backend:
    build: ./server
    image: worktrace-server:latest
    container_name: worktrace-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      # AI 报告生成：DeepSeek/OpenAI key，来自根目录 .env（git 忽略）
      AI_API_KEY: ${AI_API_KEY:-}
      # 容器内必须监听 0.0.0.0：application.yml 默认 127.0.0.1，
      # 否则 Nginx 容器反代不通
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      # 数据库连接地址与密码（prod profile 强制要求）：通过环境变量注入
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/work_system?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai"
      DB_USERNAME: ${DB_USERNAME:-wt_app}
      DB_PASSWORD: ${DB_PASSWORD:-WorkTrace_App_2026!}
    ports:
      # 调试用（可删除）：直接命中后端，如 http://127.0.0.1:8080/api/sys/ping
      - "127.0.0.1:8080:8080"

  # ── 3. 前端（Node 构建 + Nginx 托管，见 web/Dockerfile）──────
  frontend:
    build: ./web
    image: worktrace-web:latest
    container_name: worktrace-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
