name: Build & Deploy

# 推送到 master 即构建并部署到服务器；也支持手动触发
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 跳过测试：DB 单测需 MySQL 容器，交给本地/单独 CI 跑；部署流水线只出包
      - name: Build jar
        run: mvn -B -DskipTests -f server/pom.xml package

      # 重命名成稳定文件名，避免每次版本号变化导致重启脚本失效
      - name: Rename to app.jar
        run: cp server/target/*.jar app.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: worktrace-server
          path: app.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # 未配置 secrets 时为空 → 下面各步 if 判断为空则跳过（不报错）
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: worktrace-server
          path: .deploy

      - name: Copy jar to server
        if: env.SERVER_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: .deploy/app.jar
          target: ${{ secrets.DEPLOY_PATH }}   # 落为 $DEPLOY_PATH/app.jar
          overwrite: true

      - name: Restart service on server
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            ${{ secrets.RESTART_CMD }}
