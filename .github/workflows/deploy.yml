name: Build & Deploy

# 推送到 master 即构建并部署到服务器；也支持手动触发
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 跳过测试：DB 单测需 MySQL 容器，交给本地/单独 CI 跑；部署流水线只出包
      - name: Build jar
        run: mvn -B -DskipTests -f server/pom.xml package

      # 重命名成稳定文件名，避免每次版本号变化导致重启脚本失效
      - name: Rename to app.jar
        run: cp server/target/*.jar app.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: worktrace-server
          path: app.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # 未配置 secrets 时为空 → 下面各步 if 判断为空则跳过（不报错）
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: worktrace-server
          path: .deploy

      - name: Checksum jar
        run: echo "sum=$(md5sum .deploy/app.jar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: md5

      - name: Copy jar to server
        if: env.SERVER_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: .deploy/app.jar
          target: ${{ secrets.DEPLOY_PATH }}   # 落为 $DEPLOY_PATH/app.jar
          # tar 传输会保留 source 的相对路径（否则落成 $DEPLOY_PATH/.deploy/app.jar，
          # 服务重启的还是旧 jar —— 部署“成功”却不生效），剥掉 .deploy 一级
          strip_components: 1
          overwrite: true

      # 落盘 ≠ 落对：md5 不一致说明 jar 没到 ExecStart 指向的路径，立即失败
      - name: Verify jar on server
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            actual=$(md5sum "${{ secrets.DEPLOY_PATH }}/app.jar" | cut -d' ' -f1)
            echo "runner: ${{ steps.md5.outputs.sum }}"
            echo "server: $actual"
            [ "$actual" = "${{ steps.md5.outputs.sum }}" ]

      - name: Restart service on server
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            ${{ secrets.RESTART_CMD }}

      # 重启 ≠ 起得来：轮询健康端点，失败则流水线标红并带出服务日志
      - name: Health check on server
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            for i in $(seq 1 15); do
              if curl -sf -m 3 http://127.0.0.1:8080/actuator/health; then
                echo " - healthy after ${i} try(ies)"
                exit 0
              fi
              sleep 2
            done
            echo "backend NOT healthy after 30s"
            sudo journalctl -u worktrace -n 50 --no-pager
            exit 1
